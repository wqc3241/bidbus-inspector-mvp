services:
  db:
    image: postgres:16
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: inspector
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inspector"]
      interval: 2s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/inspector
      MEDIA_DIR: /data/media
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:

<title>Inspected Car Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky status header with the Gas/EV switch, section links on the left (a scrolling row on phones), one form column in walk-around order. */
:root {
  --bg: hsl(220 14% 96%);
  --surface: #ffffff;
  --surface-2: hsl(220 14% 98%);
  --fg: hsl(222 47% 11%);
  --muted: hsl(220 9% 40%);
  --line: hsl(220 13% 88%);
  --primary: hsl(175 70% 41%);
  --primary-ink: hsl(175 70% 28%);
  --primary-soft: hsl(175 60% 94%);
  --warn: hsl(32 95% 36%);
  --warn-soft: hsl(40 95% 92%);
  --bad: hsl(0 72% 46%);
  --bad-soft: hsl(0 85% 95%);
  --skip: hsl(220 9% 40%);
  --skip-soft: hsl(220 14% 92%);
  --tip-bg: hsl(222 47% 11%);
  --tip-fg: hsl(210 40% 98%);
  --radius: 0.5rem;
  --brand: #4DAD4B;
  --brand-ink: hsl(119 40% 30%);
  --brand-soft: hsl(119 45% 93%);
  --pre: hsl(214 80% 42%);
  --pre-soft: hsl(214 90% 95%);
  --font: "Rubik", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(222 47% 6%); --surface: hsl(222 40% 10%); --surface-2: hsl(222 35% 13%);
    --fg: hsl(210 40% 96%); --muted: hsl(215 20% 68%); --line: hsl(217 25% 22%);
    --primary: hsl(175 70% 45%); --primary-ink: hsl(175 65% 62%); --primary-soft: hsl(175 50% 15%);
    --warn: hsl(38 92% 62%); --warn-soft: hsl(38 60% 15%);
    --bad: hsl(0 80% 68%); --bad-soft: hsl(0 50% 17%);
    --skip: hsl(215 20% 68%); --skip-soft: hsl(220 20% 19%);
    --tip-bg: hsl(210 40% 96%); --tip-fg: hsl(222 47% 11%);
    --brand-ink: hsl(119 45% 62%); --brand-soft: hsl(119 30% 15%);
    --pre: hsl(214 90% 72%); --pre-soft: hsl(214 45% 17%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: hsl(222 47% 6%); --surface: hsl(222 40% 10%); --surface-2: hsl(222 35% 13%);
  --fg: hsl(210 40% 96%); --muted: hsl(215 20% 68%); --line: hsl(217 25% 22%);
  --primary: hsl(175 70% 45%); --primary-ink: hsl(175 65% 62%); --primary-soft: hsl(175 50% 15%);
  --warn: hsl(38 92% 62%); --warn-soft: hsl(38 60% 15%);
  --bad: hsl(0 80% 68%); --bad-soft: hsl(0 50% 17%);
  --skip: hsl(215 20% 68%); --skip-soft: hsl(220 20% 19%);
  --tip-bg: hsl(210 40% 96%); --tip-fg: hsl(222 47% 11%);
  --brand-ink: hsl(119 45% 62%); --brand-soft: hsl(119 30% 15%);
  --pre: hsl(214 90% 72%); --pre-soft: hsl(214 45% 17%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; max-width: 1240px; margin: 0 auto; }
.top-row h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.top-row .car { color: var(--muted); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.top-row .spacer { flex: 1 1 auto; }
.top-row + .top-row { padding-top: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface-2); }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg input:checked + span { background: var(--primary-ink); color: var(--surface); font-weight: 500; }
.seg input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 1px; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
.count { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.count b { font-weight: 600; color: var(--fg); }
.count.sev { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.count.sev b, .count.note b { color: inherit; }
.count.note { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.status { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.status.clean { background: var(--primary-soft); color: var(--primary-ink); }
.status.note { background: var(--warn-soft); color: var(--warn); }
.status.sev { background: var(--bad-soft); color: var(--bad); }
.lamp.stop { background: #374151; }
.xcaps { margin-left: auto; display: inline-flex; gap: 6px; flex: none; }
.xcap1 { width: 42px; height: 42px; border-radius: 10px; border: 2px dashed #c7cbd0 !important; background: #fff !important; color: #595959 !important; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; gap: 1px; }
.xcap1 small { font-size: 9px; line-height: 1; font-weight: 600; }
.xcap1.on { border: 2px solid var(--g) !important; color: var(--bid) !important; background: #effaf3 !important; }
.fr.inl .xcaps { margin-right: 8px; }
.xflag { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 6px; display: inline-flex; align-items: center; gap: 2px; flex: none; }
.xflag.sev { background: #fee2e2; color: #b91c1c; }
.xflag.note { background: #e0f2fe; color: #0369a1; }
.xend { display: flex; align-items: center; gap: 10px; background: #fef2f2; color: #b91c1c; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; font-size: 16px; }
.pbtn.red { background: #dc2626; }
.donebig.endbig { background: #dc2626; }
.endnote { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #595959; }

.example { background: var(--warn-soft); color: var(--fg); border-bottom: 1px solid var(--line); }
.example .inner { max-width: 1240px; margin: 0 auto; padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; }

.layout { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; padding-block: 20px 64px; }
nav.sections { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 104px); align-self: start; display: flex; flex-direction: column; gap: 2px; }
nav.sections a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 13px; }
nav.sections a:hover { background: var(--surface); }
nav.sections a:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.dots { display: inline-flex; gap: 3px; font-size: 11px; font-variant-numeric: tabular-nums; }
.dot { min-width: 18px; text-align: center; padding: 0 5px; border-radius: 999px; }
.dot.sev { background: var(--bad-soft); color: var(--bad); }
.dot.note { background: var(--warn-soft); color: var(--warn); }

main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 8px; min-width: 0; scroll-margin-top: 120px; }
section.card > h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; text-wrap: balance; }
.sub { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 4px; }

.row { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 6px 16px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.row:first-of-type { border-top: 0; }
.row .lab { display: flex; align-items: flex-start; gap: 6px; font-weight: 500; padding-top: 5px; min-width: 0; flex-wrap: wrap; }
.row .lab label { min-width: 0; flex: 0 1 auto; }
.row .ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span { display: inline-block; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 13px; background: var(--surface); color: var(--fg); user-select: none; }
.opt span:hover { border-color: var(--muted); }
.opt input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
.opt input:checked + span.ok { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink); font-weight: 500; }
.opt input:checked + span.note { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 500; }
.opt input:checked + span.sev { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 600; }
.opt input:checked + span.skip { background: var(--skip-soft); border-style: dashed; border-color: var(--skip); color: var(--skip); font-weight: 500; }

input[type=text], input[type=number], input[type=date], textarea {
  font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 6px 9px; width: 100%; max-width: 420px; min-width: 0;
}
input[type=number] { max-width: 140px; font-variant-numeric: tabular-nums; }
textarea { max-width: 100%; min-height: 84px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
.flag { font-size: 12px; padding: 4px 8px; border-radius: 6px; width: fit-content; max-width: 100%; }
.flag.note { background: var(--warn-soft); color: var(--warn); }
.flag.sev { background: var(--bad-soft); color: var(--bad); }
.flag.ok { background: var(--primary-soft); color: var(--primary-ink); }

.tablewrap { overflow-x: auto; margin: 8px 0 12px; border: 1px solid var(--line); border-radius: var(--radius); }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.grid th, table.grid td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; white-space: nowrap; }
table.grid th { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
table.grid tr:last-child td { border-bottom: 0; }
table.grid input[type=number] { width: 64px; max-width: 64px; padding: 4px 6px; }
table.grid input[type=text] { width: 92px; padding: 4px 6px; }
table.grid select { font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 220px; }
td.calc { font-size: 12px; white-space: normal; min-width: 150px; }
td.calc .flag { display: inline-block; margin: 1px 0; }

.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 16px; padding-block: 4px 10px; }
.photos label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
.photos input { margin-top: 3px; accent-color: var(--primary); }

.result-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 12px 0; }
.rlist { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
.rlist h3 { font-size: 13px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.rlist.sev h3 { color: var(--bad); }
.rlist.note h3 { color: var(--warn); }
.rlist.skip h3 { color: var(--skip); }
.rlist ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.rlist li { overflow-wrap: anywhere; }
.rlist .empty { color: var(--muted); font-size: 13px; }
.gate { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--line); }
.gate .what { font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 12px; align-items: center; }
button.btn { font: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button.btn.primary { background: var(--primary-ink); border-color: var(--primary-ink); color: var(--surface); }
button.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
button.btn.danger { color: var(--bad); }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.msg { font-size: 12px; color: var(--muted); }

/* Explanation lives behind the "i" trigger: hover or keyboard focus opens it. */
.tip { position: relative; display: inline-flex; flex: none; }
.tip > button { font: inherit; font-size: 12px; line-height: 1; min-width: 18px; height: 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: help; padding: 0 4px; }
.tip > button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.tip-body { display: none; position: fixed; z-index: 20; width: min(340px, calc(100vw - 32px)); background: var(--tip-bg); color: var(--tip-fg); font-size: 12.5px; font-weight: 400; line-height: 1.5; padding: 10px 12px; border-radius: 8px; box-shadow: 0 8px 24px hsl(222 47% 11% / 0.25); text-transform: none; letter-spacing: 0; }
.tip.open .tip-body { display: block; }
.tip-body p { margin: 0 0 6px; }
.tip-body p:last-child { margin: 0; }

@media (max-width: 860px) {
  header.top { position: static; }
  section.card { scroll-margin-top: 12px; padding: 14px 14px 6px; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; padding-block: 12px 48px; }
  nav.sections { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav.sections a { flex: none; background: var(--surface); border: 1px solid var(--line); }
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .lab { padding-top: 0; }
}
/* Brand, pre-fill markers and the published report view. */
.top-row h1.brand { display: flex; align-items: center; gap: 8px; }
.logo-svg { height: 20px; width: auto; color: var(--fg); display: block; }
.top-row h1.brand .crt { color: var(--muted); font-weight: 500; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.count.pre { background: var(--pre-soft); border-color: transparent; color: var(--pre); }
.count.pre b { color: inherit; }

.row.prefilled .ctl input[type=text], .row.prefilled .ctl input[type=number], .row.prefilled .ctl input[type=date] { background: var(--pre-soft); border-color: var(--pre-soft); }
.pre-tag { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: var(--pre-soft); color: var(--pre); white-space: nowrap; }
.pre-tag.changed { background: var(--warn-soft); color: var(--warn); white-space: normal; }
.said { font-size: 12px; color: var(--muted); width: 100%; }
.said b { font-weight: 600; color: var(--fg); }
.from-listing { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin: 6px 0 10px; background: var(--surface-2); }
.from-listing h3 { font-size: 13px; margin: 0 0 4px; }
.from-listing p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.disc { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 12px; font-size: 13px; }
.disc span { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
.disc b.yes { color: var(--warn); }

#report-view { padding-block: 20px 64px; }
.rp { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.rp-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.rp-bar .spacer { flex: 1 1 auto; }
.rp-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.rp-card > h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rp-card > h2 .meta { font-size: 12px; font-weight: 400; color: var(--muted); }
.rp-head { border-top: 4px solid var(--brand); }
.rp-brand { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.rp-brand .logo-svg { height: 26px; }
.rp-brand .doc { font-size: 15px; font-weight: 600; }
.rp-brand .spacer { flex: 1 1 auto; }
.rp-brand .rid { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; }
.hero-photos { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.veh h3 { font-size: 22px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
.veh .vin { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.scores { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.score { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 110px; }
.score .k { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.score .v { font-size: 26px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.score .v small { font-size: 13px; color: var(--muted); font-weight: 400; }
.score .d { font-size: 12px; color: var(--muted); max-width: 190px; }
.score.light .v { display: flex; align-items: center; gap: 8px; font-size: 20px; }
.lamp { width: 16px; height: 16px; border-radius: 999px; flex: none; }
.lamp.green { background: var(--brand); } .lamp.yellow { background: hsl(45 95% 50%); } .lamp.red { background: var(--bad); }
.bg-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); font-size: 13px; font-weight: 600; }
.bg-badge svg { width: 18px; height: 18px; }
.bg-badge.off { background: var(--skip-soft); color: var(--skip); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0 16px; margin: 0; }
.facts div { padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; }
.facts dt { font-size: 11px; color: var(--muted); }
.facts dd { margin: 0; font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.ann { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.ann li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.ann li.sev { background: var(--bad-soft); color: var(--bad); font-weight: 500; }
.ann li.note { background: var(--warn-soft); }
.ann li .tag { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding-top: 2px; flex: none; min-width: 64px; }
.quote { margin: 0; font-size: 14px; line-height: 1.55; border-left: 3px solid var(--brand); padding: 2px 0 2px 12px; }
.quote footer { font-size: 12px; color: var(--muted); margin-top: 6px; }
.dmg { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; align-items: start; }
.dmg svg.diagram { width: 100%; max-width: 200px; height: auto; color: var(--muted); }
.dmg .tablewrap { margin: 0; }
table.rt { border-collapse: collapse; width: 100%; font-size: 13px; }
table.rt th, table.rt td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.rt th { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
table.rt tr:last-child td { border-bottom: 0; }
table.rt td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mk { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; background: var(--warn); }
.mk.sev { background: var(--bad); }
button.ph.mini { width: 72px; flex: none; }
.more { margin: 10px 0 0; padding-left: 18px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.tires { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.tire { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; min-width: 0; }
.tire .pos { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.tire .tread { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tire .tread small { font-size: 12px; color: var(--muted); font-weight: 400; }
.meter { height: 6px; border-radius: 999px; background: var(--skip-soft); overflow: hidden; margin: 4px 0 6px; }
.meter i { display: block; height: 100%; background: var(--brand); }

/* Three Bidbus apps side by side: the inspector app, the seller app and the dealer app, each drawn in its own product style. */
